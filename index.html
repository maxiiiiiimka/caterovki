<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧪 Лаборатория данных</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a1a 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
    padding: 20px;
  }

  h1 {
    margin-bottom: 10px;
    font-size: 2rem;
    background: linear-gradient(90deg, #00d2ff, #7b2ff7, #ff006e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .status {
    margin-bottom: 30px;
    font-size: 0.9rem;
    color: #888;
    transition: color 0.3s;
  }
  .status.ok { color: #4caf50; }
  .status.err { color: #f44336; }

  .flasks-container {
    display: flex;
    gap: 25px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-end;
  }

  .flask-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .flask {
    position: relative;
    width: 80px;
    height: 220px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top: none;
    border-radius: 0 0 25px 25px;
    overflow: hidden;
    background: rgba(255,255,255,0.02);
    box-shadow: 
      inset 0 0 20px rgba(255,255,255,0.05),
      0 0 15px rgba(0,0,0,0.5);
  }

  .flask::before {
    content: '';
    position: absolute;
    top: -18px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.25);
    border-bottom: none;
    border-radius: 6px 6px 0 0;
  }

  .flask::after {
    content: '';
    position: absolute;
    top: 15px;
    left: 10px;
    width: 8px;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.2), transparent);
    border-radius: 10px;
    z-index: 10;
    pointer-events: none;
  }

  .liquid {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 0%;
    transition: height 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 0 0 23px 23px;
    overflow: hidden;
  }

  /* Волны */
  .wave {
    position: absolute;
    left: 0;
    width: 200%;
    height: 100%;
  }

  .wave svg {
    position: absolute;
    top: -20px;
    width: 100%;
    height: 40px;
  }

  /* Слой 1 — основная волна */
  .wave-1 {
    animation: waveDrift1 3s ease-in-out infinite;
    opacity: 0.9;
  }

  /* Слой 2 — встречная волна */
  .wave-2 {
    animation: waveDrift2 4.5s ease-in-out infinite;
    opacity: 0.5;
  }

  /* Слой 3 — фоновая рябь */
  .wave-3 {
    animation: waveDrift3 6s ease-in-out infinite;
    opacity: 0.3;
  }

  @keyframes waveDrift1 {
    0%, 100% { transform: translateX(0) translateY(0); }
    25%      { transform: translateX(-25%) translateY(-2px); }
    50%      { transform: translateX(-50%) translateY(0); }
    75%      { transform: translateX(-25%) translateY(2px); }
  }

  @keyframes waveDrift2 {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    25%      { transform: translateX(-25%) translateY(2px); }
    50%      { transform: translateX(0) translateY(0); }
    75%      { transform: translateX(-25%) translateY(-2px); }
  }

  @keyframes waveDrift3 {
    0%, 100% { transform: translateX(0) translateY(0); }
    33%      { transform: translateX(-33%) translateY(-1px); }
    66%      { transform: translateX(-66%) translateY(1px); }
  }

  /* Покачивание всей жидкости */
  .liquid-inner {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    animation: liquidSway 5s ease-in-out infinite;
  }

  @keyframes liquidSway {
    0%, 100% { transform: skewX(0deg); }
    25%      { transform: skewX(0.5deg); }
    75%      { transform: skewX(-0.5deg); }
  }

  .liquid::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(180deg, 
      rgba(255,255,255,0.15) 0%, 
      transparent 20%, 
      transparent 80%, 
      rgba(0,0,0,0.2) 100%);
    pointer-events: none;
  }

  .value {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform: translate(-50%, 50%);
    font-size: 1.2rem;
    font-weight: bold;
    z-index: 5;
    text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 2px 4px rgba(0,0,0,0.8);
    transition: bottom 1.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .label {
    font-size: 0.85rem;
    color: #aaa;
    text-align: center;
    max-width: 90px;
    font-weight: 500;
  }

  .flask-wrapper:nth-child(1) .liquid { background: linear-gradient(180deg, #ff416c 0%, #ff4b2b 100%); }
  .flask-wrapper:nth-child(1) .wave svg path { fill: #ff416c; }
  
  .flask-wrapper:nth-child(2) .liquid { background: linear-gradient(180deg, #f7971e 0%, #ffd200 100%); }
  .flask-wrapper:nth-child(2) .wave svg path { fill: #f7971e; }
  
  .flask-wrapper:nth-child(3) .liquid { background: linear-gradient(180deg, #11998e 0%, #38ef7d 100%); }
  .flask-wrapper:nth-child(3) .wave svg path { fill: #11998e; }
  
  .flask-wrapper:nth-child(4) .liquid { background: linear-gradient(180deg, #6a11cb 0%, #2575fc 100%); }
  .flask-wrapper:nth-child(4) .wave svg path { fill: #6a11cb; }
  
  .flask-wrapper:nth-child(5) .liquid { background: linear-gradient(180deg, #fc4a1a 0%, #f7b733 100%); }
  .flask-wrapper:nth-child(5) .wave svg path { fill: #fc4a1a; }
  
  .flask-wrapper:nth-child(6) .liquid { background: linear-gradient(180deg, #00b4db 0%, #0083b0 100%); }
  .flask-wrapper:nth-child(6) .wave svg path { fill: #00b4db; }
  
  .flask-wrapper:nth-child(7) .liquid { background: linear-gradient(180deg, #c471f5 0%, #fa71cd 100%); }
  .flask-wrapper:nth-child(7) .wave svg path { fill: #c471f5; }
  
  .flask-wrapper:nth-child(8) .liquid { background: linear-gradient(180deg, #00c9ff 0%, #92fe9d 100%); }
  .flask-wrapper:nth-child(8) .wave svg path { fill: #00c9ff; }

  .bubble {
    position: absolute;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    animation: rise 3s ease-in infinite;
    z-index: 4;
  }
  @keyframes rise {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(-200px) scale(0.2); opacity: 0; }
  }
</style>
</head>
<body>

<h1>🧪 Лаборатория данных</h1>
<p class="status" id="status">Загрузка данных...</p>

<div class="flasks-container" id="flasks"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0b-4UnApv9i_jc90xiSgO2ZVQVQG2STGHWPQUICQAtQ6_TqkPSVyQ3Ays41SRAZzo/exec';

const WAVE_SVG = `
<svg viewBox="0 0 1200 40" preserveAspectRatio="none">
  <path d="M0,20 Q75,0 150,20 T300,20 T450,20 T600,20 T750,20 T900,20 T1050,20 T1200,20 L1200,40 L0,40 Z"/>
</svg>
`;

const container = document.getElementById('flasks');
for (let i = 0; i < 8; i++) {
  const wrapper = document.createElement('div');
  wrapper.className = 'flask-wrapper';
  wrapper.innerHTML = `
    <div class="flask">
      <div class="liquid" id="liquid-${i}">
        <div class="liquid-inner">
          <div class="wave wave-1">${WAVE_SVG}</div>
          <div class="wave wave-2">${WAVE_SVG}</div>
          <div class="wave wave-3">${WAVE_SVG}</div>
        </div>
      </div>
      <div class="value" id="value-${i}">0</div>
    </div>
    <div class="label" id="label-${i}">Колба ${i + 1}</div>
  `;
  container.appendChild(wrapper);
}

document.querySelectorAll('.flask').forEach((flask) => {
  for (let b = 0; b < 5; b++) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    const size = Math.random() * 6 + 3;
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = Math.random() * 60 + 10 + 'px';
    bubble.style.bottom = Math.random() * 20 + 'px';
    bubble.style.animationDelay = Math.random() * 3 + 's';
    bubble.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
    flask.appendChild(bubble);
  }
});

async function loadData() {
  const statusEl = document.getElementById('status');
  try {
    const response = await fetch(SCRIPT_URL);
    if (!response.ok) throw new Error('HTTP ' + response.status);

    const data = await response.json();
    if (!Array.isArray(data)) throw new Error('Неверный формат данных');

    for (let i = 0; i < Math.min(data.length, 8); i++) {
      const name = data[i].name ?? `Колба ${i + 1}`;
      const val  = Math.min(Math.max(Number(data[i].value) ?? 0, 0), 100);

      document.getElementById(`label-${i}`).textContent = name;
      document.getElementById(`value-${i}`).textContent = Math.round(val);

      const liquid = document.getElementById(`liquid-${i}`);
      setTimeout(() => {
        liquid.style.height = val + '%';
      }, i * 120);
    }

    statusEl.textContent = '✅ Обновлено: ' + new Date().toLocaleTimeString();
    statusEl.className = 'status ok';

  } catch (err) {
    console.error('Ошибка:', err);
    statusEl.textContent = '❌ Ошибка: ' + err.message + ' (демо)';
    statusEl.className = 'status err';

    for (let i = 0; i < 8; i++) {
      const val = Math.floor(Math.random() * 101);
      document.getElementById(`value-${i}`).textContent = val;
      setTimeout(() => {
        document.getElementById(`liquid-${i}`).style.height = val + '%';
      }, i * 120);
    }
  }
}

loadData();
setInterval(loadData, 30000);
</script>

</body>
</html>
